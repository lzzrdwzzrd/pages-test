<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i gave up</title>

    <style>
        @property --hue {
            syntax: "<number>";
            inherits: false;
            initial-value: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            min-height: 100dvh;
            margin: 0;
        }

        h1 {
            color: hsl(var(--hue) 100% 99%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
                "Open Sans", "Helvetica Neue", sans-serif;
            font-weight: 500;
            letter-spacing: -0.05em;
            word-spacing: 0.2em;
            font-size: 10rem;
            text-align: center;

            text-shadow:
                0 0 0.1em hsl(var(--hue) 90% 90%),

                0 0 0.3em hsl(var(--hue) 100% 80%),

                0 0 1em hsl(var(--hue) 100% 80%),

                0 0 2em hsl(var(--hue) 80% 40%),

                0 0 10em hsl(var(--hue) 70% 35%);

            animation: rainbow-glow 6s linear infinite;
        }

        @keyframes rainbow-glow {
            from {
                --hue: 0;
            }

            to {
                --hue: 360;
            }
        }
    </style>
</head>

<body>
    <h1>webdev sucks</h1>
</body>

</html>
